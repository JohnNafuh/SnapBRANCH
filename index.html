<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2630ff">
<title>SnapBRANCH — Capture the Raw Unfiltered</title>
<meta name="description" content="Drop one unedited photo. Everyone who visits sees it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="frame">
    <h1>SnapBRANCH</h1>
    <p class="lede">Everyday moments, real people.</p>
    <p class="sub">Drop one unedited photo. Everyone who visits sees it.</p>
    <button class="shutter" id="open" type="button">Drop a snap</button>
    <p class="count" id="count" aria-live="polite"></p>
  </div>
  <div class="reel" aria-hidden="true"><div class="track" id="track"></div></div>
</header>

<main>
  <h2>Fresh snaps</h2>
  <div class="wall" id="feed"></div>
  <button class="more" id="more" type="button" hidden>Load more</button>
</main>

<dialog id="composer" class="sheet" aria-labelledby="comp-t">
  <form id="form" method="dialog">
    <h2 id="comp-t">Drop a snap</h2>
    <label class="drop" for="photo">
      <img id="preview" alt="Snap preview" hidden>
      <span id="drop-text">Tap to take a photo or choose one</span>
      <input id="photo" type="file" accept="image/*" hidden>
    </label>
    <label class="field">Username
      <input id="handle" type="text" maxlength="20" minlength="2" required autocomplete="nickname" placeholder="nafuh">
    </label>
    <label class="field">Location <small>(optional)</small>
      <input id="place" type="text" maxlength="60" autocomplete="address-level2" placeholder="Abuja, Nigeria">
    </label>
    <p class="err" id="err" role="alert"></p>
    <div class="row">
      <button class="ghost" id="cancel" type="button">Cancel</button>
      <button class="shutter small" id="share" type="submit" disabled>Share snap</button>
    </div>
  </form>
</dialog>

<dialog id="view" class="view">
  <img id="view-img" alt="">
  <p id="view-cap"></p>
</dialog>

<div id="flash" aria-hidden="true"></div>
<script src="script.js"></script>
</body>
</html>
