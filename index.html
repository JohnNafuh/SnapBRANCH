<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>SnapBRANCH — Capture the Raw Unfiltered</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="hero">
    <div class="scene" id="scene" aria-hidden="true">
      <div class="tilt" id="tilt"><div class="spin" id="spin"></div></div>
    </div>
    <h1>SnapBRANCH</h1>
    <p class="tag">Everyday moments, real people.</p>
  </header>

  <section class="stage" id="stage">
    <button class="block-btn" id="cta" type="button">Drop Today's Snap</button>
  </section>
  <p class="hint" id="hint" aria-live="polite">Tap the button to start.</p>

  <section class="feed" aria-labelledby="feed-h">
    <h2 id="feed-h">The feed</h2>
    <div id="feed"></div>
  </section>
</main>

<dialog id="gate" class="mc" aria-labelledby="gate-t">
  <svg id="avatar" class="avatar" viewBox="0 0 8 8" shape-rendering="crispEdges" role="img" aria-label="Pixel-art Minecraft avatar"></svg>
  <h2 id="gate-t">=== NOTICE ===</h2>
  <p id="gate-copy" class="mc-copy" data-text="You have no idea how lucky you are to experience this website... the last person was literally rejected for having a huge nose!"></p>
  <button class="block-btn gold" id="proceed" type="button">&gt; PROCEED TO UPLOAD &lt;</button>
</dialog>

<dialog id="composer" class="sheet" aria-labelledby="comp-t">
  <form id="form" method="dialog">
    <h2 id="comp-t">Your snap</h2>
    <label class="field">Username
      <input id="handle" name="handle" type="text" maxlength="20" minlength="2" required autocomplete="nickname" placeholder="e.g. nafuh">
    </label>
    <label class="drop" id="drop" for="photo">
      <img id="preview" alt="Snap preview" hidden>
      <span id="drop-text"><b>📸</b>Tap to capture or choose photo</span>
      <input id="photo" type="file" accept="image/*" hidden>
    </label>
    <p class="err" id="err" role="alert"></p>
    <div class="row">
      <button class="ghost" id="cancel" type="button">Cancel</button>
      <button class="block-btn" id="share" type="submit" disabled>Share Snap</button>
    </div>
  </form>
</dialog>

<script src="script.js"></script>
</body>
</html>
