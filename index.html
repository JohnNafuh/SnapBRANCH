<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SnapBRANCH — Capture the Raw Unfiltered</title>
<meta name="description" content="Take a snap right now. No uploads, no edits. Everyone who visits sees it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>SnapBRANCH</h1>
  <button class="cam-open" id="open" type="button" aria-label="Take a snap">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>
  </button>
</header>
<p class="intro">Everyday moments, real people. <span id="count"></span></p>
<section class="stories" id="stories" aria-label="Recent snaps"></section>
<main><div class="feed" id="feed"></div><button class="more" id="more" type="button" hidden>Load more</button></main>

<dialog id="composer" class="camfull" aria-label="Take a snap">
  <form id="form" method="dialog">
    <video id="cam" autoplay playsinline muted></video>
    <img id="preview" alt="Your snap" hidden>
    <div class="cam-msg" id="cam-msg"><p id="cam-text">Starting camera...</p><button class="send" id="retry" type="button" hidden>Try again</button></div>
    <div class="cam-top">
      <button type="button" class="cam-btn" id="cancel" aria-label="Close">&#10005;</button>
      <button type="button" class="cam-btn" id="flip" aria-label="Switch camera">&#8635;</button>
    </div>
    <div class="cam-shoot" id="shoot"><button type="button" class="cam-shutter" id="snap" aria-label="Take snap" disabled></button></div>
    <div class="cam-post" id="post" hidden>
      <input id="handle" type="text" maxlength="16" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Your Snapchat username" aria-label="Snapchat username">
      <input id="place" type="text" maxlength="60" autocomplete="address-level2" placeholder="Location (optional)" aria-label="Location">
      <p class="err" id="err" role="alert"></p>
      <div class="row">
        <button class="ghost" id="retake" type="button">Retake</button>
        <button class="send" id="share" type="submit" disabled>Send</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="view" class="storyview" aria-label="Snap">
  <div class="bar"><i id="fill"></i></div>
  <div class="s-top"><div><b id="s-name"></b><span id="s-meta"></span></div><button type="button" class="cam-btn" id="s-close" aria-label="Close">&#10005;</button></div>
  <img id="view-img" alt="">
  <a id="view-add" class="send big" target="_blank" rel="noopener noreferrer" hidden>Add on Snapchat</a>
  <button class="tap prev" id="s-prev" type="button" aria-label="Previous"></button>
  <button class="tap next" id="s-next" type="button" aria-label="Next"></button>
</dialog>

<div id="flash" aria-hidden="true"></div>
<script src="script.js"></script>
</body>
</html>
