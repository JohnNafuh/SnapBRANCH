<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapBRANCH</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Start Section & Slipping Button */
    .hero-box {
      width: 100%;
      background: #1e293b;
      padding: 30px 20px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      position: relative;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .slipping-btn {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: transform 0.15s ease, top 0.2s ease, left 0.2s ease;
      position: relative;
      user-select: none;
    }

    /* Luck Modal / Notice */
    .notice-modal {
      display: none;
      background: #334155;
      border-left: 4px solid #38bdf8;
      padding: 16px;
      border-radius: 12px;
      margin-top: 20px;
      width: 100%;
      animation: fadeIn 0.3s ease-in-out;
    }

    .notice-modal p {
      font-size: 0.9rem;
      line-height: 1.4;
      color: #e2e8f0;
    }

    .notice-modal .btn-continue {
      margin-top: 12px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      font-weight: 700;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
    }

    /* Upload Form */
    .upload-section {
      display: none;
      width: 100%;
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      margin-top: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.4s ease-in-out;
    }

    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .form-group input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      outline: none;
      font-size: 0.95rem;
    }

    .form-group input[type="file"] {
      display: none;
    }

    .custom-file-upload {
      border: 2px dashed #475569;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      color: #94a3b8;
      font-size: 0.9rem;
      background: #0f172a;
    }

    .image-preview {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }

    .submit-btn {
      width: 100%;
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 14px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 10px;
    }

    /* Posts Feed */
    .feed-section {
      width: 100%;
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .snap-card {
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .snap-card img {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      display: block;
    }

    .snap-card .card-footer {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
    }

    .snap-card .username {
      font-weight: 700;
      color: #38bdf8;
      font-size: 0.95rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1>SnapBRANCH</h1>
    <p>Share standard snaps from your everyday life.</p>
  </header>

  <div class="container">
    
    <!-- Hero Box with Slipping Button -->
    <div class="hero-box" id="heroBox">
      <button class="slipping-btn" id="actionBtn">Drop Today's Snap</button>
    </div>

    <!-- Notice Modal -->
    <div class="notice-modal" id="noticeModal">
      <p>⚠️ <strong>Access Granted!</strong> You have no idea how lucky you are to experience this website... the last person was literally rejected for having a huge nose. Consider yourself blessed.</p>
      <button class="btn-continue" id="continueBtn">Proceed to Upload</button>
    </div>

    <!-- Upload Form -->
    <div class="upload-section" id="uploadSection">
      <form id="snapForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="e.g. alex_dev" required />
        </div>

        <div class="form-group">
          <label>Your Daily Snap</label>
          <label for="snapInput" class="custom-file-upload" id="uploadLabel">
            📸 Tap to select image
          </label>
          <input type="file" id="snapInput" accept="image/*" required />
          <img id="imagePreview" class="image-preview" alt="Snap preview" />
        </div>

        <button type="submit" class="submit-btn">Post Snap</button>
      </form>
    </div>

    <!-- Feed Container -->
    <div class="feed-section" id="feedSection">
      <!-- Uploaded snaps will display here -->
    </div>

  </div>

  <script>
    const actionBtn = document.getElementById('actionBtn');
    const heroBox = document.getElementById('heroBox');
    const noticeModal = document.getElementById('noticeModal');
    const continueBtn = document.getElementById('continueBtn');
    const uploadSection = document.getElementById('uploadSection');
    const snapInput = document.getElementById('snapInput');
    const imagePreview = document.getElementById('imagePreview');
    const uploadLabel = document.getElementById('uploadLabel');
    const snapForm = document.getElementById('snapForm');
    const feedSection = document.getElementById('feedSection');

    let hasSlipped = false;

    // Slipping Button Logic
    function evadeButton() {
      if (!hasSlipped) {
        const xOffset = (Math.random() > 0.5 ? 1 : -1) * (60 + Math.random() * 40);
        const yOffset = (Math.random() > 0.5 ? 1 : -1) * (30 + Math.random() * 20);
        
        actionBtn.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
        hasSlipped = true;
      }
    }

    // Trigger evade on touch or mouseover for mobile/desktop
    actionBtn.addEventListener('touchstart', evadeButton);
    actionBtn.addEventListener('mouseover', evadeButton);

    // Button Click Logic
    actionBtn.addEventListener('click', () => {
      if (!hasSlipped) {
        evadeButton();
      } else {
        heroBox.style.display = 'none';
        noticeModal.style.display = 'block';
      }
    });

    // Continue to Upload
    continueBtn.addEventListener('click', () => {
      noticeModal.style.display = 'none';
      uploadSection.style.display = 'block';
    });

    // Image Preview Handling
    snapInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          imagePreview.src = event.target.result;
          imagePreview.style.display = 'block';
          uploadLabel.textContent = 'Change Selected Image';
        };
        reader.readAsDataURL(file);
      }
    });

    // Form Submission
    snapForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const imageSrc = imagePreview.src;

      if (!username || !imageSrc) return;

      // Create new snap card
      const card = document.createElement('div');
      card.className = 'snap-card';
      card.innerHTML = `
        <img src="${imageSrc}" alt="Daily Snap" />
        <div class="card-footer">
          <span class="username">@${username}</span>
        </div>
      `;

      // Insert at the top of the feed
      feedSection.prepend(card);

      // Reset Form
      snapForm.reset();
      imagePreview.style.display = 'none';
      uploadLabel.textContent = '📸 Tap to select image';
      uploadSection.style.display = 'none';
      heroBox.style.display = 'flex';
      actionBtn.style.transform = 'translate(0, 0)';
      hasSlipped = false;
    });
  </script>
</body>
</html>
